name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude-review:
    # Skip drafts, bot-authored PRs, and runs not triggered by the PR author
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      github.actor == github.event.pull_request.user.login
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Workaround for anthropics/claude-code-action#2047.
      # The action sets CLAUDE_CODE_ENTRYPOINT and CLAUDE_CODE_ACTION for the CLI. 
      # With them set, the API refuses the credential: every run ends with is_error and no model call.
      # This runs the CLI through a wrapper that clears both. This should be removed once #2047 is fixed.
      - name: Install Claude Code without action markers
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          cat > "$RUNNER_TEMP/claude" <<EOF
          #!/bin/sh
          unset CLAUDE_CODE_ENTRYPOINT CLAUDE_CODE_ACTION
          exec "$HOME/.local/bin/claude" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/claude"
          "$RUNNER_TEMP/claude" --version

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: ${{ runner.temp }}/claude
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: |
            --model opus
            --permission-mode auto
