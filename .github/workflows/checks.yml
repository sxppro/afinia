name: CI
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  push:
    branches: [master]
  workflow_call:

permissions: { contents: read }

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter afinia-web typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}   # lint even if typecheck fails
        run: pnpm --filter afinia-web lint
      # - run: pnpm --filter afinia-web build
